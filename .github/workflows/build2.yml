name: Build AppImage

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # Обязательно подтягиваем сабмодули, gnulib часто лежит там

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            texinfo \
            file \
            wget \
            fuse \
            gnulib \
            libncurses-dev

      - name: Generate configure script (Fix Gnulib/Gettext conflict)
        run: |
          mkdir -p m4
          
          # Если в проекте есть стандартный скрипт bootstrap, он решит всё сам
          if [ -x "./bootstrap" ]; then
            ./bootstrap
          else
            # 1. Запускаем autopoint, который может затереть макросы старыми версиями
            autopoint -f || true
            
            # 2. ВОССТАНАВЛИВАЕМ макросы gnulib, перезаписывая старые файлы gettext
            if [ -f "m4/gnulib-comp.m4" ] || [ -f "m4/gnulib-cache.m4" ]; then
              echo "Gnulib detected. Running gnulib-tool --update..."
              gnulib-tool --update || true
            fi
            
            # 3. Указываем aclocal жестко смотреть в m4/
            export ACLOCAL="aclocal -I m4"
            if [ -f Makefile.am ] && ! grep -q 'ACLOCAL_AMFLAGS' Makefile.am; then
              echo 'ACLOCAL_AMFLAGS = -I m4' >> Makefile.am
            fi
            
            # 4. Генерируем configure
            if [ -x "./autogen.sh" ]; then
              ./autogen.sh
            else
              autoreconf -vfi
            fi
          fi

      - name: Configure project
        run: |
          ./configure \
            --prefix=/usr \
            --disable-dependency-tracking

      - name: Build project
        run: |
          make -j"$(nproc)"

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          make DESTDIR="$PWD/AppDir" install-strip

      - name: Create AppRun, Desktop file and Icon
        run: |
          # 1. Создаем AppRun
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          # ВНИМАНИЕ: Замените 'nano' на имя вашего исполняемого файла, если оно другое!
          exec "$HERE/usr/bin/nano" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 2. Создаем .desktop файл (требуется для linuxdeploy)
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/nano.desktop <<'EOF'
          [Desktop Entry]
          Name=My App
          Exec=nano %F
          Terminal=true
          Type=Application
          Icon=nano
          Categories=Utility;
          EOF

          # 3. Создаем пустую иконку (чтобы linuxdeploy не ругался)
          touch AppDir/usr/share/icons/hicolor/256x256/apps/nano.png

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Bundle shared libraries
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/nano \
            --desktop-file AppDir/usr/share/applications/nano.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/nano.png

      - name: Download appimagetool
        run: |
          wget -O appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=x86_64 ./appimagetool.AppImage AppDir myapp-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-AppImage
          path: myapp-x86_64.AppImage

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: myapp-x86_64.AppImage
          generate_release_notes: true
