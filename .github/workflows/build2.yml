name: Build GNU nano AppImage

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            gettext \
            libncurses-dev \
            pkg-config \
            texinfo \
            file \
            wget \
            fuse

- name: Generate configure script
        run: |
          sudo apt-get install -y gnulib
          
          # У GNU nano autogen.sh сам корректно вызывает gnulib-tool 
          # и autoreconf. Ручные патчи через sed здесь не нужны.
          ./autogen.sh


      - name: Configure GNU nano
        run: |
          ./configure \
            --prefix=/usr \
            --disable-dependency-tracking

      - name: Build GNU nano
        run: |
          make -j"$(nproc)"

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          make DESTDIR="$PWD/AppDir" install-strip

          test -x AppDir/usr/bin/nano
          file AppDir/usr/bin/nano

      - name: Create AppRun
        run: |
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/nano" "$@"
          EOF

          chmod +x AppDir/AppRun

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Bundle shared libraries
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/nano

      - name: Download appimagetool
        run: |
          wget -O appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage

          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1

          ARCH=x86_64 ./appimagetool.AppImage \
            AppDir \
            nano-x86_64.AppImage

      - name: Test AppImage
        run: |
          chmod +x nano-x86_64.AppImage
          ./nano-x86_64.AppImage --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-AppImage
          path: nano-x86_64.AppImage

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nano-x86_64.AppImage
          generate_release_notes: true
