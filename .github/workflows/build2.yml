name: Build Nano AppImage

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Для лучшей совместимости по GLIBC с другими дистрибутивами

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncursesw5-dev \
            pkg-config \
            file \
            wget

      - name: Download and Build GNU Nano
        run: |
          NANO_VERSION="9.2" # Укажите нужную версию
          wget https://www.nano-editor.org/dist/v8/nano-${NANO_VERSION}.tar.xz
          tar -xf nano-${NANO_VERSION}.tar.xz
          cd nano-${NANO_VERSION}
          
          # Запускаем сразу configure БЕЗ autoreconf
          ./configure --prefix=/usr --sysconfdir=/etc
          make -j$(nproc)
          make DESTDIR=${GITHUB_WORKSPACE}/AppDir install

      - name: Prepare AppDir & Build AppImage
        run: |
          cd ${GITHUB_WORKSPACE}
          
          # Скачиваем appimagetool
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Копируем иконку и .desktop файл в корень AppDir
          cp AppDir/usr/share/pixmaps/nano.png AppDir/ 2>/dev/null || true
          cp AppDir/usr/share/applications/nano.desktop AppDir/ 2>/dev/null || true
          
          # Создаем простейший AppRun, если его нет
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/nano" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Упаковываем AppImage (используем ARCH=x86_64)
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir GNU_Nano-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNU-Nano-AppImage
          path: GNU_Nano-x86_64.AppImage
